# CI for textkit. Committed by the repository administrator, never by TandemVelocity (ADR-0040 D7).
#
# Deliberately stricter than the local `pytest -q` a delivery run executes:
#   tests      the unit suite on the oldest and newest supported Python;
#   contract   consumer contract tests in ci/, which run only here (CONTRIBUTING.md, rule 4);
#   changelog  a branch must add a line to CHANGELOG.md (CONTRIBUTING.md, rule 1).
# It runs on push, so a pushed candidate branch is tested at the exact revision TandemVelocity published, and
# GitHub reports that revision as the workflow run's head_sha (ADR-0040 D3).
name: ci

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pytest
      - name: Report the revision under test
        run: echo "testing ${{ github.sha }} on ${{ github.ref }}"
      - run: pytest -q

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pytest
      - run: pytest -q ci

  changelog:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: CHANGELOG.md records the change
        run: |
          git fetch --quiet origin main
          changed="$(git diff --name-only origin/main...HEAD)"
          printf '%s\n' "$changed"
          if ! printf '%s\n' "$changed" | grep -qx 'CHANGELOG.md'; then
            echo "::error file=CHANGELOG.md::Add a line under '## Unreleased' in CHANGELOG.md (CONTRIBUTING.md, rule 1)."
            exit 1
          fi
